name: Update profile

on:
  schedule:
    - cron: "0 0 */2 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check GitHub token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN não está definido."
            exit 1
          fi

          echo "GITHUB_TOKEN está definido."

      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: brunoMyguelDotCom

        run: |
          python generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/dark_mode.svg
          git add -- assets/light_mode.svg
          git add -- assets/stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git status --short

          git commit \
            -m "chore: update profile stats"

          git push --force origin main
